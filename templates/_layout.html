<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fruit sweets{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top" id="main-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🍓 Fruit~Sweets 🍓
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            {% set page = request.url_rule.__str__() %}
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if page == '/' %}active{% endif %}">
                        Produse
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/cart" class="nav-link {% if page == '/cart' %}active{% endif %}">
                        Cos
                        {% if cart_count > 0 %}
                        <span class="badge bg-danger rounded-pill">{{ cart_count }}</span>
                        {% endif %}
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/checkout" class="nav-link {% if page == '/checkout' %}active{% endif %}">
                        Comanda
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/contact" class="nav-link {% if page == '/contact' %}active{% endif %}">
                        Contact
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
